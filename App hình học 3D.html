<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Hình Hộp Chữ Nhật 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-200">
    <div class="flex h-screen">
        <!-- Controls Panel -->
        <div class="w-80 bg-slate-800/90 border-r border-slate-700 flex flex-col overflow-hidden shrink-0">
            <!-- Header -->
            <div class="p-4 border-b border-slate-700 bg-slate-800/50">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-500 p-2.5 rounded-xl shadow-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white">Hình Học 3D</h1>
                        <p id="shapeType" class="text-xs text-slate-400">Hình Hộp Chữ Nhật</p>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex p-1 bg-slate-800/50 m-4 mb-0 rounded-xl border border-slate-700">
                <button id="tabExplore" onclick="setTab('explore')"
                    class="flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 bg-indigo-600 text-white">
                    👁️ Khám Phá
                </button>
                <button id="tabVolume" onclick="setTab('volume')"
                    class="flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                    📐 Thể Tích
                </button>
            </div>

            <!-- Controls -->
            <div class="p-4 space-y-5 overflow-y-auto custom-scrollbar flex-1">
                <!-- Size Controls -->
                <div class="space-y-3">
                    <div class="flex items-center gap-2 text-indigo-400 font-bold text-xs uppercase tracking-wider">
                        📏 Kích Thước (Đơn vị)
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium text-slate-300">
                            <span>Chiều dài (a)</span>
                            <span id="widthVal" class="text-indigo-400">3</span>
                        </div>
                        <input type="range" id="widthSlider" min="1" max="5" step="0.5" value="3"
                            class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium text-slate-300">
                            <span>Chiều rộng (b)</span>
                            <span id="depthVal" class="text-indigo-400">2</span>
                        </div>
                        <input type="range" id="depthSlider" min="1" max="5" step="0.5" value="2"
                            class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-medium text-slate-300">
                            <span>Chiều cao (c)</span>
                            <span id="heightVal" class="text-indigo-400">2</span>
                        </div>
                        <input type="range" id="heightSlider" min="1" max="5" step="0.5" value="2"
                            class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <button onclick="setCube()"
                        class="w-full py-1.5 text-xs font-semibold text-slate-400 border border-slate-700 rounded hover:bg-slate-800 hover:text-white transition-colors">
                        Đặt về Hình Lập Phương (3x3x3)
                    </button>
                </div>

                <div class="h-px bg-slate-700/50"></div>

                <!-- Unfold Controls -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-amber-400 font-bold text-xs uppercase tracking-wider">
                            🔄 Mở Hình
                        </div>
                        <span id="unfoldPercent"
                            class="text-xs bg-slate-800 px-2 py-0.5 rounded text-amber-400">0%</span>
                    </div>

                    <input type="range" id="unfoldSlider" min="0" max="100" step="1" value="0"
                        class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500">

                    <div class="flex gap-2">
                        <button id="playBtn" onclick="togglePlay()"
                            class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold bg-slate-700 hover:bg-slate-600 text-white">
                            ▶️ Tự động
                        </button>
                        <button onclick="resetUnfold()"
                            class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300">
                            🔄
                        </button>
                    </div>

                    <div class="flex items-center gap-3 pt-1">
                        <span class="text-xs font-semibold text-slate-500 w-10">Tốc độ</span>
                        <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1"
                            class="flex-1 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400">
                    </div>
                </div>

                <div class="h-px bg-slate-700/50"></div>

                <!-- Highlight Controls -->
                <div class="space-y-3">
                    <div class="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider">
                        👁️ Hiển Thị
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <button id="hlVertices" onclick="setHighlight('vertices')"
                            class="py-1.5 px-2 rounded border text-xs font-semibold border-slate-700 text-slate-400 hover:bg-slate-700">
                            Đỉnh
                        </button>
                        <button id="hlFaces" onclick="setHighlight('faces')"
                            class="py-1.5 px-2 rounded border text-xs font-semibold border-slate-700 text-slate-400 hover:bg-slate-700">
                            Mặt
                        </button>
                        <button id="hlEdges" onclick="setHighlight('edges')"
                            class="py-1.5 px-2 rounded border text-xs font-semibold border-slate-700 text-slate-400 hover:bg-slate-700">
                            Cạnh
                        </button>
                    </div>
                </div>

                <!-- Volume Panel (hidden by default) -->
                <div id="volumePanel" class="hidden bg-emerald-900/50 p-4 rounded-xl border border-emerald-500/30">
                    <h3 class="text-emerald-300 font-bold mb-2">📐 Tính Thể Tích</h3>
                    <div class="text-sm text-emerald-200/80 mb-2">
                        Công thức: <span id="formula" class="font-mono font-bold text-white">V = a × b × c</span>
                    </div>
                    <div class="bg-black/20 p-3 rounded-lg text-center">
                        <span id="calculation" class="font-mono text-xl font-bold text-white">3 × 2 × 2 = 12</span>
                        <span class="ml-1 text-emerald-300 font-bold">đơn vị³</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3D Canvas -->
        <div class="flex-1 relative">
            <div id="canvas-container"></div>
            <div class="absolute bottom-4 left-0 w-full text-center pointer-events-none">
                <p
                    class="inline-block bg-black/50 backdrop-blur px-4 py-2 rounded-full text-xs text-slate-400 border border-white/10">
                    <span class="text-indigo-400 font-bold">Mẹo:</span> Kéo chuột để xoay, cuộn để zoom
                </p>
            </div>
        </div>
    </div>
