<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học Hình Hộp Chữ Nhật 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Segoe UI', sans-serif;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    /* Custom scrollbar for webkit */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 1);
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease-out forwards;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.92.7?external=react,react-dom,three,@react-three/fiber",
    "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react"
  }
}
</script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, Grid, Environment, Text, Edges } from '@react-three/drei';
    import { Play, Pause, RotateCcw, Box, Ruler, Eye, Calculator, ScanFace, Scaling, CheckSquare } from 'lucide-react';

    // --- CONSTANTS ---
    const COLORS = {
      front: '#FF6B6B',   // Coral Red
      back: '#FF9F43',    // Orange
      top: '#4ECDC4',     // Turquoise
      bottom: '#2980B9',  // Strong Blue
      left: '#F1C40F',    // Vivid Yellow
      right: '#2ECC71',   // Emerald Green

      text: '#FFFFFF',
      textOutline: '#000000',

      // Dark mode specific
      grid: '#334155',    // Slate 700
      gridSection: '#475569', // Slate 600
      background: '#0f172a', // Slate 900

      // Highlights
      vertex: '#FF0000',       // Red (Bright red for visibility)
      edgeHighlight: '#FF0000', // Red (Bright red for visibility)
      faceDimmed: '#333333'
    };

    const DEFAULT_DIMENSIONS = {
      width: 3,
      height: 2,
      depth: 2
    };

    const LABELS = {
      front: "Trước",
      back: "Sau",
      top: "Trên",
      bottom: "Dưới",
      left: "Trái",
      right: "Phải"
    };

    // --- COMPONENT: FACE MESH ---
    const FaceMesh = React.memo(({
      width,
      height,
      color,
      label,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      labelRotation = [0, 0, 0],
      showLabels,
      highlightMode
    }) => {

      const isFaceHighlight = highlightMode === 'faces';
      const isEdgeHighlight = highlightMode === 'edges';
      const isVertexHighlight = highlightMode === 'vertices';

      // Ref for the material to animate the glow
      const materialRef = useRef(null);

      // Animate the face glow if highlighted
      useFrame((state) => {
        if (isFaceHighlight && materialRef.current) {
          // Create a pulsing effect using sine wave
          const t = state.clock.getElapsedTime();
          const intensity = 0.5 + Math.sin(t * 3) * 0.3; // Oscillates between 0.2 and 0.8
          materialRef.current.emissiveIntensity = intensity;
        }
      });

      // Corner positions for vertices (relative to plane center)
      const corners = [
        [-width / 2, -height / 2, 0],
        [width / 2, -height / 2, 0],
        [width / 2, height / 2, 0],
        [-width / 2, height / 2, 0],
      ];

      return (
        <group position={position} rotation={rotation}>
          <mesh>
            <planeGeometry args={[width, height]} />
            <meshStandardMaterial
              ref={materialRef}
              color={color}
              side={THREE.DoubleSide}
              transparent={false}
              opacity={1}
              roughness={0.5}
              metalness={0.1}
              // If face highlighted, we use a strong emissive color. The intensity is animated above.
              emissive={isFaceHighlight ? color : '#000000'}
              emissiveIntensity={isFaceHighlight ? 0.8 : 0}
            />

            {/* Edges */}
            <Edges
              threshold={15}
              color={isEdgeHighlight ? COLORS.edgeHighlight : "#000000"}
              lineWidth={isEdgeHighlight ? 6 : 1} // Thicker edges when highlighted
            />
          </mesh>

          {/* Vertices (Spheres at corners) */}
          {isVertexHighlight && corners.map((corner, idx) => (
            <mesh key={idx} position={[corner[0], corner[1], 0]}>
              <sphereGeometry args={[0.15, 16, 16]} />
              <meshBasicMaterial color={COLORS.vertex} />
            </mesh>
          ))}

          {/* Labels - Front Side */}
          {showLabels && (
            <Text
              position={[0, 0, 0.05]}
              fontSize={Math.min(width, height) * 0.25}
              color={COLORS.text}
              anchorX="center"
              anchorY="middle"
              outlineWidth={Math.min(width, height) * 0.02}
              outlineColor={COLORS.textOutline}
              rotation={labelRotation}
            >
              {label}
            </Text>
          )}

          {/* Labels - Back Side (Visible when unfolded) */}
          {showLabels && (
            <group rotation={[0, Math.PI, 0]}>
              <Text
                position={[0, 0, 0.05]}
                fontSize={Math.min(width, height) * 0.25}
                color={COLORS.text}
                anchorX="center"
                anchorY="middle"
                outlineWidth={Math.min(width, height) * 0.02}
                outlineColor={COLORS.textOutline}
                // We mirror the rotation logic effectively by grouping
                rotation={[labelRotation[0], -labelRotation[1], labelRotation[2]]}
              >
                {label}
              </Text>
            </group>
          )}
        </group>
      );
    });

    // --- COMPONENT: CUBOID SCENE ---
    const CuboidScene = ({
      unfoldProgress,
      dimensions,
      showLabels,
      highlightMode
    }) => {
      const { width, height, depth } = dimensions;

      // Refs for groups to animate rotation
      const frontGroupRef = useRef(null);
      const backGroupRef = useRef(null);
      const leftGroupRef = useRef(null);
      const rightGroupRef = useRef(null);
      const topGroupRef = useRef(null);

      useFrame(() => {
        // Target angle is 90 degrees (PI/2) when fully unfolded
        const targetAngle = (Math.PI / 2) * unfoldProgress;

        if (frontGroupRef.current) frontGroupRef.current.rotation.x = targetAngle;
        if (backGroupRef.current) backGroupRef.current.rotation.x = -targetAngle;
        if (leftGroupRef.current) leftGroupRef.current.rotation.z = targetAngle;
        if (rightGroupRef.current) rightGroupRef.current.rotation.z = -targetAngle;

        // The top face is attached to the BACK face. 
        if (topGroupRef.current) topGroupRef.current.rotation.x = -targetAngle;
      });

      return (
        <React.Fragment>
          <ambientLight intensity={0.8} />
          <directionalLight position={[10, 15, 10]} intensity={1.5} castShadow />
          <directionalLight position={[-10, 5, -10]} intensity={0.5} />

          {/* City environment for nice reflections/lighting */}
          <Environment preset="city" />

          {/* Controls */}
          <OrbitControls
            minDistance={5}
            maxDistance={30}
            enablePan={true}
            target={[0, 0, 0]}
          />

          {/* Ground Grid - Adjusted for Dark Mode */}
          <Grid
            infiniteGrid
            fadeDistance={40}
            sectionColor={COLORS.gridSection}
            cellColor={COLORS.grid}
            position={[0, -height / 2 - 0.05, 0]}
            cellThickness={1}
            sectionThickness={1.5}
          />

          {/* Main Object Container */}
          <group position={[0, 0, 0]}>

            {/* BOTTOM FACE (Fixed Base) */}
            <FaceMesh
              width={width}
              height={depth}
              color={COLORS.bottom}
              label={LABELS.bottom}
              position={[0, -height / 2, 0]}
              rotation={[-Math.PI / 2, 0, 0]}
              showLabels={showLabels}
              highlightMode={highlightMode}
            />

            {/* FRONT GROUP */}
            <group position={[0, -height / 2, depth / 2]} ref={frontGroupRef}>
              <FaceMesh
                width={width}
                height={height}
                color={COLORS.front}
                label={LABELS.front}
                position={[0, height / 2, 0]}
                showLabels={showLabels}
                highlightMode={highlightMode}
              />
            </group>

            {/* BACK GROUP */}
            <group position={[0, -height / 2, -depth / 2]} ref={backGroupRef}>
              <FaceMesh
                width={width}
                height={height}
                color={COLORS.back}
                label={LABELS.back}
                position={[0, height / 2, 0]}
                rotation={[0, Math.PI, 0]}
                showLabels={showLabels}
                highlightMode={highlightMode}
              />

              {/* TOP GROUP - Hinged at top of BACK face */}
              <group position={[0, height, 0]} ref={topGroupRef}>
                <FaceMesh
                  width={width}
                  height={depth}
                  color={COLORS.top}
                  label={LABELS.top}
                  position={[0, 0, depth / 2]}
                  rotation={[-Math.PI / 2, 0, 0]}
                  showLabels={showLabels}
                  highlightMode={highlightMode}
                />
              </group>
            </group>

            {/* LEFT GROUP */}
            <group position={[-width / 2, -height / 2, 0]} ref={leftGroupRef}>
              <FaceMesh
                width={depth} // Width of side face = Depth of box
                height={height}
                color={COLORS.left}
                label={LABELS.left}
                position={[0, height / 2, 0]}
                rotation={[0, -Math.PI / 2, 0]}
                showLabels={showLabels}
                highlightMode={highlightMode}
              />
            </group>

            {/* RIGHT GROUP */}
            <group position={[width / 2, -height / 2, 0]} ref={rightGroupRef}>
              <FaceMesh
                width={depth}
                height={height}
                color={COLORS.right}
                label={LABELS.right}
                position={[0, height / 2, 0]}
                rotation={[0, Math.PI / 2, 0]}
                showLabels={showLabels}
                highlightMode={highlightMode}
              />
            </group>

          </group>
        </React.Fragment>
      );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      // --- STATE ---
      const [activeTab, setActiveTab] = useState('explore');

      // Dimensions
      const [dimensions, setDimensions] = useState(DEFAULT_DIMENSIONS);

      // Animation & Rendering
      const [unfoldProgress, setUnfoldProgress] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1);
      const [showLabels, setShowLabels] = useState(true);
      const [highlightMode, setHighlightMode] = useState('none');

      // Refs for animation
      const animationRef = useRef(null);
      const directionRef = useRef(1);

      // --- ANIMATION LOOP ---
      useEffect(() => {
        let lastTime = performance.now();
        const animate = (time) => {
          const delta = (time - lastTime) / 1000;
          lastTime = time;

          if (isPlaying) {
            setUnfoldProgress((prev) => {
              const change = 0.5 * speed * delta * directionRef.current;
              let next = prev + change;
              if (next >= 1) { next = 1; directionRef.current = -1; }
              else if (next <= 0) { next = 0; directionRef.current = 1; }
              return next;
            });
            animationRef.current = requestAnimationFrame(animate);
          }
        };

        if (isPlaying) {
          lastTime = performance.now();
          animationRef.current = requestAnimationFrame(animate);
        } else if (animationRef.current) {
          cancelAnimationFrame(animationRef.current);
        }
        return () => {
          if (animationRef.current) cancelAnimationFrame(animationRef.current);
        };
      }, [isPlaying, speed]);

      // --- HANDLERS ---
      const handleDimChange = (axis, val) => {
        const num = parseFloat(val);
        setDimensions(prev => ({ ...prev, [axis]: num }));
      };

      const reset = () => {
        setIsPlaying(false);
        setUnfoldProgress(0);
        directionRef.current = 1;
      };

      const isCube = dimensions.width === dimensions.height && dimensions.height === dimensions.depth;
      const volume = dimensions.width * dimensions.height * dimensions.depth;

      return (
        <div className="relative w-full h-screen bg-[#0f172a] text-slate-200 overflow-hidden font-sans flex flex-col md:block">

          {/* --- CONTROLS SECTION --- */}
          {/* Desktop: Absolute Left Sidebar. Mobile: Relative Top Section (Order 1) */}
          <div className="order-1 relative w-full h-[45vh] shrink-0 z-20 md:absolute md:order-none md:top-0 md:left-0 md:h-full md:w-full md:max-w-sm md:p-4 md:h-auto md:pointer-events-none">

            <div className="w-full h-full flex flex-col bg-slate-900 border-b border-slate-700 md:bg-slate-900/90 md:backdrop-blur-md md:rounded-2xl md:shadow-2xl md:border md:border-slate-700/50 md:pointer-events-auto overflow-hidden">

              {/* Header */}
              <div className="p-4 md:p-5 border-b border-slate-700/50 bg-slate-800/50 shrink-0">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-500 p-2 md:p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
                    <Box size={20} className="text-white md:w-6 md:h-6" />
                  </div>
                  <div>
                    <h1 className="text-base md:text-lg font-bold text-white leading-tight">Hình Học 3D</h1>
                    <p className="text-[10px] md:text-xs text-slate-400 font-medium">{isCube ? 'Hình Lập Phương' : 'Hình Hộp Chữ Nhật'}</p>
                  </div>
                </div>
              </div>

              {/* Tabs */}
              <div className="flex p-1 bg-slate-800/50 m-3 mb-0 md:m-4 md:mb-0 rounded-xl border border-slate-700 shrink-0">
                <button
                  onClick={() => setActiveTab('explore')}
                  className={`flex-1 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all ${activeTab === 'explore'
                      ? 'bg-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
                    }`}
                >
                  <Eye size={14} className="md:w-4 md:h-4" /> Khám Phá
                </button>
                <button
                  onClick={() => setActiveTab('volume')}
                  className={`flex-1 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all ${activeTab === 'volume'
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
                    }`}
                >
                  <Calculator size={14} className="md:w-4 md:h-4" /> Thể Tích
                </button>
              </div>

              {/* Scrollable Content */}
              <div className="p-4 md:p-5 space-y-5 md:space-y-6 overflow-y-auto custom-scrollbar flex-1">

                {/* 1. SIZE CONTROLS */}
                <div className="space-y-3 md:space-y-4">
                  <div className="flex items-center gap-2 text-indigo-400 font-bold text-[10px] md:text-xs uppercase tracking-wider">
                    <Scaling size={12} className="md:w-[14px] md:h-[14px]" /> Kích Thước (Đơn vị)
                  </div>

                  {/* Width */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-medium text-slate-300">
                      <span>Chiều dài (a)</span>
                      <span className="text-indigo-400">{dimensions.width}</span>
                    </div>
                    <input type="range" min="1" max="5" step="0.5"
                      value={dimensions.width}
                      onChange={(e) => handleDimChange('width', e.target.value)}
                      className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                    />
                  </div>

                  {/* Depth */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-medium text-slate-300">
                      <span>Chiều rộng (b)</span>
                      <span className="text-indigo-400">{dimensions.depth}</span>
                    </div>
                    <input type="range" min="1" max="5" step="0.5"
                      value={dimensions.depth}
                      onChange={(e) => handleDimChange('depth', e.target.value)}
                      className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                    />
                  </div>

                  {/* Height */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-medium text-slate-300">
                      <span>Chiều cao (c)</span>
                      <span className="text-indigo-400">{dimensions.height}</span>
                    </div>
                    <input type="range" min="1" max="5" step="0.5"
                      value={dimensions.height}
                      onChange={(e) => handleDimChange('height', e.target.value)}
                      className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                    />
                  </div>

                  <button
                    onClick={() => setDimensions({ width: 3, height: 3, depth: 3 })}
                    className="w-full py-1.5 text-[10px] md:text-xs font-semibold text-slate-400 border border-slate-700 rounded hover:bg-slate-800 hover:text-white transition-colors"
                  >
                    Đặt về Hình Lập Phương (3x3x3)
                  </button>
                </div>

                <div className="h-px bg-slate-700/50"></div>

                {/* 2. OPENING SPEED */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-amber-400 font-bold text-[10px] md:text-xs uppercase tracking-wider">
                      <RotateCcw size={12} className="md:w-[14px] md:h-[14px]" /> Mở Hình
                    </div>
                    <span className="text-[10px] md:text-xs bg-slate-800 px-2 py-0.5 rounded text-amber-400">{Math.round(unfoldProgress * 100)}%</span>
                  </div>

                  <input type="range" min="0" max="1" step="0.01"
                    value={unfoldProgress}
                    onChange={(e) => { setUnfoldProgress(parseFloat(e.target.value)); setIsPlaying(false); }}
                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500"
                  />

                  <div className="flex gap-2">
                    <button
                      onClick={() => setIsPlaying(!isPlaying)}
                      className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold transition-all ${isPlaying ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'bg-slate-700 hover:bg-slate-600 text-white'
                        }`}
                    >
                      {isPlaying ? <Pause size={14} /> : <Play size={14} />} {isPlaying ? 'Dừng' : 'Tự động'}
                    </button>
                    <button onClick={reset} className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300">
                      <RotateCcw size={14} />
                    </button>
                  </div>

                  <div className="flex items-center gap-3 pt-1">
                    <span className="text-[10px] font-semibold text-slate-500 w-10">Tốc độ</span>
                    <input type="range" min="0.2" max="3" step="0.1"
                      value={speed} onChange={(e) => setSpeed(parseFloat(e.target.value))}
                      className="flex-1 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400"
                    />
                  </div>
                </div>

                <div className="h-px bg-slate-700/50"></div>

                {/* 3. VISUAL OPTIONS (Labels & Highlights) */}
                <div className="space-y-4">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-[10px] md:text-xs uppercase tracking-wider">
                    <Eye size={12} className="md:w-[14px] md:h-[14px]" /> Hiển Thị
                  </div>

                  {/* Toggle Labels */}
                  <label className="flex items-center justify-between cursor-pointer group">
                    <span className="text-xs md:text-sm text-slate-300 group-hover:text-white transition-colors">Tên các mặt</span>
                    <div
                      onClick={() => setShowLabels(!showLabels)}
                      className={`w-9 h-4 md:w-10 md:h-5 rounded-full relative transition-colors ${showLabels ? 'bg-emerald-500' : 'bg-slate-700'}`}
                    >
                      <div className={`absolute top-0.5 md:top-1 left-1 w-3 h-3 md:w-3 md:h-3 bg-white rounded-full transition-transform ${showLabels ? 'translate-x-4 md:translate-x-5' : 'translate-x-0'}`} />
                    </div>
                  </label>

                  {/* Highlight Toggles */}
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      onClick={() => setHighlightMode(highlightMode === 'vertices' ? 'none' : 'vertices')}
                      className={`py-1.5 px-2 rounded border text-[10px] md:text-xs font-semibold transition-all ${highlightMode === 'vertices' ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                    >
                      Đỉnh
                    </button>
                    <button
                      onClick={() => setHighlightMode(highlightMode === 'faces' ? 'none' : 'faces')}
                      className={`py-1.5 px-2 rounded border text-[10px] md:text-xs font-semibold transition-all ${highlightMode === 'faces' ? 'bg-pink-500/20 border-pink-500 text-pink-300' : 'border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                    >
                      Mặt
                    </button>
                    <button
                      onClick={() => setHighlightMode(highlightMode === 'edges' ? 'none' : 'edges')}
                      className={`py-1.5 px-2 rounded border text-[10px] md:text-xs font-semibold transition-all ${highlightMode === 'edges' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                    >
                      Cạnh
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* --- CANVAS CONTAINER (Order 2) --- */}
          {/* Desktop: Absolute Fullscreen. Mobile: Flex-1 */}
          <div className="order-2 flex-1 relative w-full md:absolute md:inset-0 md:h-full md:z-0">
            <Canvas shadows camera={{ position: [8, 8, 10], fov: 45 }}>
              <color attach="background" args={[COLORS.background]} />
              <CuboidScene
                unfoldProgress={unfoldProgress}
                dimensions={dimensions}
                showLabels={showLabels}
                highlightMode={highlightMode}
              />
            </Canvas>

            {/* --- OVERLAY: VOLUME CALCULATION --- */}
            {/* Desktop: Absolute Top Right. Mobile: Absolute Top Right (inside Canvas container) */}
            {activeTab === 'volume' && (
              <div className="absolute top-4 right-4 md:top-4 md:right-8 w-64 md:w-72 animate-fade-in-up pointer-events-none z-10">
                <div className="bg-emerald-900/90 backdrop-blur-md p-4 md:p-5 rounded-xl md:rounded-2xl border border-emerald-500/30 shadow-2xl pointer-events-auto">
                  <div className="flex items-center gap-2 mb-2 md:mb-3 text-emerald-300 border-b border-emerald-500/20 pb-2">
                    <Calculator size={18} className="md:w-[20px] md:h-[20px]" />
                    <h2 className="font-bold text-sm md:text-base">Tính Thể Tích</h2>
                  </div>

                  {/* Formula */}
                  <div className="mb-3 md:mb-4">
                    <p className="text-[10px] md:text-xs text-emerald-200/70 mb-1">Công thức:</p>
                    <div className="text-sm md:text-lg font-mono font-bold text-white bg-black/20 p-2 rounded border border-emerald-500/20 text-center">
                      {isCube ? 'V = a × a × a' : 'V = a × b × c'}
                    </div>
                    <div className="text-center mt-1 text-[10px] md:text-xs text-emerald-400 italic">
                      {isCube ? '(Cạnh × Cạnh × Cạnh)' : '(Dài × Rộng × Cao)'}
                    </div>
                  </div>

                  {/* Calculation */}
                  <div>
                    <p className="text-[10px] md:text-xs text-emerald-200/70 mb-1">Tính toán:</p>
                    <div className="bg-emerald-800/40 p-2 md:p-3 rounded-lg border border-emerald-500/20 text-center">
                      <span className="font-mono text-base md:text-xl font-bold text-white">
                        {dimensions.width} × {dimensions.depth} × {dimensions.height} = {Number(volume.toFixed(2))}
                      </span>
                      <span className="ml-1 text-sm md:text-lg font-bold text-emerald-300">dm³</span>
                    </div>

                    <div className="mt-2 md:mt-3 text-center">
                      <p className="text-[10px] md:text-[11px] text-emerald-400/80 italic font-medium">
                        ( Xếp khối đơn vị là 1 dm³ )
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- FOOTER: INSTRUCTIONS & CREDIT --- */}
            <div className="absolute bottom-4 left-0 w-full pointer-events-none flex flex-col items-center justify-center gap-2 px-4 text-center z-10">
              {/* Tips */}
              <p className="inline-block bg-black/50 backdrop-blur px-3 py-1.5 md:px-4 md:py-2 rounded-full text-[10px] md:text-xs text-slate-400 border border-white/10">
                <span className="text-indigo-400 font-bold">Mẹo:</span> Xoay chuột trái để nhìn, chuột phải để di chuyển.
              </p>
              {/* Design Credit */}
              <p className="text-[10px] md:text-[11px] text-slate-500 font-medium tracking-wide shadow-black drop-shadow-md">
                Phát triển bởi: @ Nguyễn Thế Đức - Giáo viên yêu công nghệ @
              </p>
            </div>

          </div>

        </div>
      );
    };

    // --- INITIALIZATION ---
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>

</html>
