<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Jar body -->
  <rect x="14" y="20" width="36" height="36" rx="6" ry="6" fill="#f0f4ff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Yogurt inside -->
  <rect x="16" y="30" width="32" height="24" rx="4" ry="4" fill="#fef9c3"/>
  <!-- Yogurt top layer (white cream) -->
  <ellipse cx="32" cy="30" rx="16" ry="4" fill="#fffde7"/>
  <!-- Lid -->
  <rect x="10" y="14" width="44" height="10" rx="5" ry="5" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Lid shine -->
  <rect x="16" y="17" width="16" height="3" rx="1.5" fill="#c4b5fd" opacity="0.7"/>
  <!-- Label -->
  <rect x="18" y="36" width="28" height="12" rx="3" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <!-- Label text -->
  <text x="32" y="45" font-family="Arial, sans-serif" font-size="7" fill="#be185d" text-anchor="middle" font-weight="bold">Sữa chua</text>
  <!-- Jar shine -->
  <rect x="38" y="22" width="4" height="16" rx="2" fill="white" opacity="0.4"/>
</svg>
